<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>nspawnmgr — New Nspawn</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/js/theme-init.js}"></script>
</head>
<body th:attr="data-base-path=@{/}">
<div th:replace="~{fragments/app-shell :: shell(
        title=${t.get('page.create.title')}, subtitle=null,
        activeNav='machines', currentUser=${currentUser}, addMenu=null,
        content=~{::#page-content})}">
<div id="page-content">
<form id="create-form" class="card">
    <div class="field">
        <label for="name" th:text="${t.get('field.name')}">Name</label>
        <input type="text" id="name" name="name" pattern="^[a-z0-9][a-z0-9-]{1,62}$" required/>
    </div>
    <div class="field">
        <label for="templateId" th:text="${t.get('field.template')}">Template</label>
        <select id="templateId" name="templateId">
            <option th:each="tpl : ${templates}" th:value="${tpl.id}" th:text="${tpl.name}"
                    th:attr="data-rdp-state=${tpl.rdpState}">template</option>
        </select>
    </div>
    <div class="field">
        <label for="description" th:text="${t.get('field.description')}">Description</label>
        <input type="text" id="description" name="description" th:placeholder="${t.get('field.descriptionPlaceholder')}"/>
    </div>
    <div class="field field-inline">
        <input type="checkbox" id="rdpEnabled" name="rdpEnabled"/>
        <label for="rdpEnabled" th:text="${t.get('field.enableRdp')}">Enable RDP</label>
    </div>
    <p id="rdp-unavailable-hint" class="hint" style="display:none" th:text="${t.get('page.create.rdpUnavailableHint')}">RDP isn't available for this
        template — see its own "RDP" setting on the Templates admin page for why.</p>
    <div class="field field-inline">
        <input type="checkbox" id="vncEnabled" name="vncEnabled"/>
        <label for="vncEnabled" th:text="${t.get('field.enableVnc')}">Enable VNC</label>
    </div>
    <div class="field">
        <label for="desktopManager" th:text="${t.get('field.desktopManager')}">Desktop manager</label>
        <select id="desktopManager" name="desktopManager" disabled>
            <option value="NONE" th:text="${t.get('field.desktopManagerNone')}">None</option>
            <option value="KDE_STANDARD">KDE (standard)</option>
            <option value="XFCE4">Xfce</option>
        </select>
    </div>
    <button type="submit" class="btn-primary" th:text="${t.get('button.create')}">Create</button>
</form>
<p id="status" class="status-message"></p>
</div>
</div>
<script th:src="@{/js/theme-toggle.js}"></script>
<script th:src="@{/js/create.js}"></script>
</body>
</html>
