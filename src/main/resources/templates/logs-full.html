<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>nspawnmgr — Full log</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/js/theme-init.js}"></script>
</head>
<body th:attr="data-base-path=@{/}" th:data-is-admin="${currentUser.role.name() == 'ADMIN'}">
<div th:replace="~{fragments/app-shell :: shell(
        title='Full log', subtitle='Everything currently in the application log, plus any rotated files',
        activeNav='log', currentUser=${currentUser}, addMenu=null,
        content=~{::#page-content})}">
    <div id="page-content">
        <p><a th:href="@{/logs}">&laquo; Back to last 100 lines</a></p>
        <p><a id="btn-download" href="#">Download</a></p>
        <pre id="log-content">Loading...</pre>

        <h2>Rotated logs</h2>
        <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>Filename</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="rotated-log-list"></tbody>
        </table>
        </div>
    </div>
</div>

<script th:src="@{/js/theme-toggle.js}"></script>
<script th:src="@{/js/dialog.js}"></script>
<script th:src="@{/js/logs-full.js}"></script>
</body>
</html>
