<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${host != null} ? 'nspawnmgr — Edit Host' : 'nspawnmgr — New Host'">nspawnmgr — Host</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/js/theme-init.js}"></script>
</head>
<body th:attr="data-base-path=@{/},data-host-id=${host != null ? host.id : ''}">
<div th:replace="fragments/theme-toggle :: widget"></div>
<h1 th:text="${host != null} ? 'Edit host' : 'New host'">Host</h1>
<p><a th:href="@{/admin/hosts}">&laquo; Back to hosts</a></p>
<form id="host-form" class="card">
    <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" th:value="${host != null ? host.name : ''}" required/>
    </div>
    <div class="field">
        <label for="hostname">Hostname or IP address</label>
        <input type="text" id="hostname" name="hostname" th:value="${host != null ? host.hostname : ''}" required/>
    </div>
    <div class="field">
        <label for="ownerUsername">Owner username</label>
        <input type="text" id="ownerUsername" name="ownerUsername"
               th:value="${host != null ? host.owner.username : ''}" required/>
        <p class="hint">Must belong to a user who has already logged in at least once.</p>
    </div>
    <div class="field field-inline">
        <input type="checkbox" id="sshEnabled" name="sshEnabled"
               th:checked="${host != null and host.externalSshPort != null}"/>
        <label for="sshEnabled">SSH</label>
    </div>
    <div class="field">
        <label for="sshPort">SSH port</label>
        <input type="number" id="sshPort" name="sshPort" min="1" max="65535"
               th:value="${host != null and host.externalSshPort != null ? host.externalSshPort : 22}"/>
    </div>
    <div class="field field-inline">
        <input type="checkbox" id="rdpEnabled" name="rdpEnabled" th:checked="${host != null and host.rdpEnabled}"/>
        <label for="rdpEnabled">RDP</label>
    </div>
    <div class="field">
        <label for="rdpPort">RDP port</label>
        <input type="number" id="rdpPort" name="rdpPort" min="1" max="65535"
               th:value="${host != null and host.externalRdpPort != null ? host.externalRdpPort : 3389}"/>
    </div>
    <div class="field field-inline">
        <input type="checkbox" id="vncEnabled" name="vncEnabled" th:checked="${host != null and host.vncEnabled}"/>
        <label for="vncEnabled">VNC</label>
    </div>
    <div class="field">
        <label for="vncPort">VNC port</label>
        <input type="number" id="vncPort" name="vncPort" min="1" max="65535"
               th:value="${host != null and host.externalVncPort != null ? host.externalVncPort : 5900}"/>
    </div>
    <button type="submit" class="btn-primary">Save</button>
</form>
<p id="status" class="status-message"></p>
<script th:src="@{/js/theme-toggle.js}"></script>
<script th:src="@{/js/dialog.js}"></script>
<script th:src="@{/js/admin-host-form.js}"></script>
</body>
</html>
