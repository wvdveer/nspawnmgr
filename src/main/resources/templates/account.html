<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>nspawnmgr — Profile</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/js/theme-init.js}"></script>
</head>
<body th:attr="data-base-path=@{/}">
<div th:replace="~{fragments/app-shell :: shell(
        title=${t.get('nav.profile')}, subtitle=${t.get('page.account.subtitle', currentUser.username)},
        activeNav='profile', currentUser=${currentUser}, addMenu=null,
        content=~{::#page-content})}">
    <div id="page-content">
        <div class="panel">
            <h2 th:text="${t.get('page.account.languageHeading')}">Language</h2>
            <p th:text="${t.get('page.account.languageHint')}">Choose which language the interface displays in.</p>
            <div class="panel-section">
                <div class="inline-controls">
                    <select id="account-language">
                        <option value="" th:text="${t.get('page.account.languageAutoDetect')}">Auto-detect from browser</option>
                        <option th:each="entry : ${availableLanguages}" th:value="${entry.key}"
                                th:selected="${currentUser.preferredLanguage == entry.key}"
                                th:text="${entry.value}">Language name</option>
                    </select>
                    <button id="btn-save-language" class="btn-primary" th:text="${t.get('page.account.saveLanguage')}">Save</button>
                </div>
                <p id="language-status" class="status-message"></p>
            </div>
        </div>
        <div class="panel">
            <h2 th:text="${t.get('page.account.guacamolePasswordHeading')}">Guacamole password</h2>
            <p th:text="${t.get('page.account.guacamolePasswordHint')}">Sets the password for your Guacamole account.</p>
            <div class="panel-section">
                <div class="inline-controls">
                    <input type="password" id="guacamole-password" th:placeholder="${t.get('page.account.newPasswordPlaceholder')}" minlength="8"/>
                    <button id="btn-save-guacamole-password" class="btn-primary" th:text="${t.get('page.account.updatePassword')}">Update password</button>
                </div>
                <p id="guacamole-password-status" class="status-message"></p>
            </div>
        </div>
        <div class="panel" th:if="${logoutUrl != null}">
            <h2 th:text="${t.get('page.account.logoutHeading')}">Log out</h2>
            <p th:text="${t.get('page.account.logoutHint')}">Ends your session with the login system.</p>
            <div class="panel-section">
                <a th:href="${logoutUrl}" class="btn-danger" th:text="${t.get('page.account.logout')}">Log out</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/theme-toggle.js}"></script>
<script th:src="@{/js/account.js}"></script>
</body>
</html>
