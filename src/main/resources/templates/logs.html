<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>nspawnmgr — Log</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/js/theme-init.js}"></script>
</head>
<body th:attr="data-base-path=@{/}">
<div th:replace="~{fragments/app-shell :: shell(
        title='Log', subtitle='Last 100 lines of the application log',
        activeNav='log', currentUser=${currentUser}, addMenu=null,
        content=~{::#page-content})}">
    <div id="page-content">
        <p><button id="btn-show-full" class="btn-primary">Show full log</button></p>
        <pre id="log-content">Loading...</pre>
    </div>
</div>
<script th:src="@{/js/theme-toggle.js}"></script>
<script th:src="@{/js/logs.js}"></script>
</body>
</html>
