# Installed as a systemd drop-in at /etc/systemd/system/dnsmasq.service.d/nspawnmgr-wait-for-bridge.conf
# by this package's postinst/post_install.
#
# nspawnbr0 (this package's shared container bridge) is marked RequiredForOnline=yes in its own
# .network file, so network-online.target won't be reached until systemd-networkd-wait-online.service
# confirms it's actually configured - but stock dnsmasq packaging never orders itself after
# network-online.target, so on a host starting many services at once, dnsmasq.service can win the
# race and start before nspawnbr0 has its address applied. Confirmed live (acer, 2026-09-09): a
# plain host reboot left dnsmasq exited immediately and stuck `failed` (no restart), so every
# container self-assigned a 169.254.x.x link-local address instead of getting a real DHCP lease.
# The postinst's own up-to-10s poll for nspawnbr0 only protects the install/upgrade moment itself -
# it doesn't run again on a later, unrelated reboot, which is exactly when this was hit.
#
# The After=/Wants= ordering below turned out NOT to be sufficient on its own - confirmed live on
# a second reboot (acer, 2026-09-09): systemd-networkd-wait-online.service exited SUCCESS ~52s
# after boot while nspawnbr0 itself stayed unconfigured (no address, link down) for 27+ minutes
# afterward with nothing ever bringing it up on its own. Whatever race lets nspawnbr0 miss its own
# networkd configuration pass apparently isn't one wait-online actually observes for this
# interface, so ordering after network-online.target can complete without nspawnbr0 ever being
# ready.
#
# `networkctl reload` was the first attempted self-heal command below, and turned out NOT to work
# either - confirmed live on a THIRD reboot (acer, 2026-09-09): the ExecStartPre loop ran for
# 24+ minutes (~120 reload attempts) with nspawnbr0 still stuck off the entire time. Only a full
# `systemctl restart systemd-networkd` (not just `networkctl reload`) actually brought it up,
# confirmed live in the same session. The loop below now calls that instead - heavier (re-inits
# every interface networkd manages, not just this one bridge) so it retries less aggressively than
# the reload-based version did.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
# Actively drives nspawnbr0 towards readiness rather than passively hoping network-online.target
# already covered it (see the file header - confirmed live that it doesn't always). `+` runs this
# as root regardless of whatever User=/sandboxing dnsmasq's own unit declares - `systemctl restart
# systemd-networkd` needs it. Up to ~12s per attempt (`restart` itself takes a moment to complete
# and re-settle, hence the longer 1.5s poll interval than a plain reload would need); if that's not
# enough, ExecStartPre failing fails the whole unit, and Restart=on-failure below retries the
# entire thing (including this loop) every 2s - so a slower recovery still self-heals, just over
# more retries instead of one.
ExecStartPre=+/bin/sh -c 'i=0; while [ "$i" -lt 8 ]; do ip -4 -o addr show nspawnbr0 2>/dev/null | grep -q "10\.100\.0\.1/24" && exit 0; systemctl restart systemd-networkd 2>/dev/null || true; sleep 1.5; i=$((i+1)); done; exit 1'
# Belt-and-suspenders: even if the ExecStartPre loop above somehow isn't enough, retry rather than
# staying failed forever.
Restart=on-failure
RestartSec=2
