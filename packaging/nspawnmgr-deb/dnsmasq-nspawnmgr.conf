# Installed at /etc/dnsmasq.d/nspawnmgr.conf by the nspawnmgr .deb postinst.
#
# Lets managed containers resolve each other by their nspawnmgr name. Scoped to the shared
# container bridge only (see 70-nspawnmgr-bridge.netdev/.network) - never reachable from the host's
# own LAN/uplink interface, so this never becomes an open resolver. interface= alone does NOT
# achieve that scoping by itself: dnsmasq's default (without bind-interfaces or the old
# bind-dynamic) is to bind the *wildcard* address on port 53 and use interface= only to filter
# which requests it answers - confirmed live, that wildcard bind collides with anything else
# already on port 53 (systemd-resolved's stub listener, in particular, which most real hosts run).
# bind-interfaces forces an actual bind to nspawnbr0's own address (10.100.0.1) instead - the
# "dynamic" part of the old bind-dynamic (re-scanning for veths appearing/disappearing) isn't
# needed now that every container sits on one fixed bridge that always exists once created, but the
# "bind to a specific address, not the wildcard" part still is. no-hosts stops it from also serving
# the host's own /etc/hosts to containers; addn-hosts points at the dynamic file
# ContainerDnsSyncService keeps in sync with each running container's current internal address (one
# "<address> <name>" line per container, regenerated whenever it changes).
#
# domain=internal + expand-hosts: containers are also reachable by an FQDN (e.g. b1.internal), not
# just the bare name - dnsmasq answers both automatically from the same addn-hosts entries, no
# duplicate lines needed. "internal" (not something made up) is IANA's special-use TLD reserved
# exactly for this - RFC 8375, the same category as home.arpa - so it's guaranteed to never collide
# with a real public domain. Fixed, non-admin-configurable convention, same treatment as
# nspawnbr0/10.100.0.0/24 above.
#
# local=/internal/ - confirmed live necessary in addition to domain=/expand-hosts above: domain=
# only controls the suffix dnsmasq DECORATES its own answers with (short-name lookups, DHCP fqdn,
# etc) - it does NOT by itself make dnsmasq authoritative for queries that already ARRIVE
# pre-qualified (e.g. a client querying "b1.internal" directly, which is exactly what
# systemd-resolved does once a container learns "internal" as its search domain - see the
# 80-container-host0.network.d drop-in in the template). Without local=/internal/, an incoming
# already-qualified query falls through hosts/addn-hosts matching entirely and gets forwarded
# upstream (see server= below) instead of being answered locally - .internal is IANA-reserved and
# doesn't exist publicly, so that would just fail (or, worse, leak container names to whichever
# public resolver is configured). local=/internal/ tells dnsmasq to treat .internal as its own
# authoritative zone: answer from hosts/addn-hosts data only, NXDOMAIN for anything genuinely
# unknown there, never forward.
#
# server= - confirmed live necessary: without any upstream configured, this dnsmasq instance only
# ever answered .internal names (NXDOMAIN for everything else via local=/internal/'s own
# no-forward rule, but genuinely unqualified names have nowhere to go at all) - every container's
# host0 interface gets this as its *default* DNS route (not just for .internal), so real-world
# hostnames a container needs to resolve on its own (dnf/pacman/apt fetching from their real
# package mirrors, in particular) failed outright with "Could not resolve host". Deliberately NOT
# hardcoded here anymore - live-editable via /admin/settings (e.g. to point at a corporate DNS
# server instead), see SettingsService.dnsUpstreamServers()/ContainerDnsSyncService, which keeps
# /etc/dnsmasq.d/nspawnmgr-upstream.conf (its own server= lines, defaulting to 1.1.1.1/9.9.9.9) in
# sync - auto-included alongside this file by dnsmasq's own conf-dir=/etc/dnsmasq.d/ (Debian's
# default /etc/dnsmasq.conf), no extra directive needed here. Same non-open-resolver reasoning
# as above applies regardless of which servers end up configured: still bound only to nspawnbr0,
# unreachable from the host's real LAN/uplink interface.
interface=nspawnbr0
bind-interfaces
no-hosts
addn-hosts=/etc/nspawnmgr/dns-hosts
domain=internal
expand-hosts
local=/internal/
