# Installed as a systemd drop-in at /etc/systemd/system/systemd-nspawn@.service.d/nspawnmgr-wait-for-network.conf
# by this package's postinst/post_install - applies to EVERY systemd-nspawn container on this
# host (the stock template unit, not something scoped to nspawnmgr-managed machines only), since
# any autostart-enabled container hits the same problem.
#
# Confirmed live (acer, 2026-09-09): on a host reboot, `machines.target.wants/` pulls in any
# autostart container (nspawnmgr's own self-hosted machine and its DB machine, in this case) with
# no ordering dependency on nspawnbr0/dnsmasq being ready at all. A container that starts before
# the bridge's DHCP server is actually up gets a self-assigned 169.254.x.x link-local address and
# STAYS on it - a container never retries DHCP on its own once it's fallen back, so this doesn't
# self-heal later even after dnsmasq (see dnsmasq-wait-for-nspawnbr0.conf) does come up.
#
# After=/Wants=dnsmasq.service alone isn't enough either: dnsmasq.service's own Restart=on-failure
# loop means systemd considers dnsmasq's start JOB complete (and this container free to proceed)
# the moment its FIRST attempt finishes, success or not - not once it's genuinely reached active.
# So this actively polls for both nspawnbr0 having its real address AND dnsmasq actually being
# active before letting the container start.
[Unit]
After=dnsmasq.service
Wants=dnsmasq.service

[Service]
# `+` runs this as root regardless of the container's own User=/sandboxing directives. Deliberately
# proceeds anyway (exit 0) once the ~20s budget runs out rather than refusing to start the
# container at all - a container that ends up with a bad IP is recoverable later (a restart, or
# nspawnmgr's own liveness reconciliation flagging it); a container that silently never starts at
# all because the host's own networking was unusually slow to recover would be worse.
ExecStartPre=+/bin/sh -c 'i=0; while [ "$i" -lt 40 ]; do ip -4 -o addr show nspawnbr0 2>/dev/null | grep -q "10\.100\.0\.1/24" && systemctl is-active --quiet dnsmasq 2>/dev/null && exit 0; sleep 0.5; i=$((i+1)); done; exit 0'
